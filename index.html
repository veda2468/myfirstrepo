<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph Text -->
    <p>This is a sample paragraph showing how text looks in HTML. You can use <strong>bold text</strong> or <em>italicized text</em> to emphasize words.</p>

    <!-- Image Placeholder -->
    <img src="https://placeholder.com" alt="Sample Placeholder Image" width="150" height="150">

    <!-- Unordered List -->
    <h3>My Favorite Things</h3>
    <ul>
        <li>Coding with HTML</li>
        <li>Designing websites</li>
        <li>Learning new technologies</li>
    </ul>

</html>
